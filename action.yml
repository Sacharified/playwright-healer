name: 'playwright-healer'
description: 'Auto-heal flaky Playwright tests via an LLM agent + Playwright MCP'
author: 'playwright-healer contributors'

inputs:
  mode:
    description: 'Run mode: ingest | heal | dry-run'
    required: true
  api-key:
    description: 'Inference-provider API key (Anthropic, Gemini, or — for Ollama localhost — may be empty)'
    required: false
  healer-token:
    description: 'PAT or GitHub App token required for PR creation and workflow_dispatch'
    required: true
  github-token:
    description: 'GitHub token; defaults to the built-in action token'
    required: false
    default: ${{ github.token }}
  setup-command:
    description: 'Command to set up the application under test (healer mode)'
    required: false
    default: ''
  start-command:
    description: 'Command to start the application under test (healer mode)'
    required: false
    default: ''
  test-command:
    description: 'Command to run Playwright tests'
    required: false
    default: ''
  base-url:
    description: 'Base URL of the application under test'
    required: false
    default: ''
  provider:
    description: 'Inference provider: anthropic | gemini | ollama'
    required: false
    default: 'anthropic'
  model:
    description: 'Model id (provider-specific). Empty string means use provider default.'
    required: false
    default: ''
  api-endpoint:
    description: 'Custom provider endpoint. Mainly useful for self-hosted Ollama (e.g. http://localhost:11434). Empty string uses provider default.'
    required: false
    default: ''

  report-path:
    description: 'Glob or path to Playwright JSON report (ingest mode)'
    required: false
    default: 'test-results/results.json'

  flake-rate-threshold:
    description: 'Flake rate (0.0–1.0) above which a test is a flake candidate. Default: 0.2 (20%)'
    required: false
    default: '0.2'

  flake-window-days:
    description: 'Rolling window in days for flake-rate and slow-regression computation. Default: 7'
    required: false
    default: '7'

  slow-regression-pct:
    description: 'p95 duration growth ratio that triggers slow-regression detection. Default: 1.5 (50% slower)'
    required: false
    default: '1.5'

  rerun-count:
    description: 'Number of validation re-runs after a fix (Phase 3+). Default: 10'
    required: false
    default: '10'

  rerun-pass-rate:
    description: 'Required pass rate (0.0–1.0) for a fix to be accepted (Phase 3+). Default: 0.9'
    required: false
    default: '0.9'

  max-budget-usd:
    description: 'Max USD per healing run (Phase 3+). Default: 2.00'
    required: false
    default: '2.00'

  max-turns:
    description: 'Max agent turns per healing run (Phase 3+). Default: 30'
    required: false
    default: '30'

  retention-days:
    description: 'Days to retain state branch records before GC. Default: 90. Set to 0 to disable GC.'
    required: false
    default: '90'

  max-heals-per-test-per-week:
    description: 'Per-test heal attempt cap per 7-day window (circuit breaker). Default: 3'
    required: false
    default: '3'

  enable-selector-fixes:
    description: 'Enable selector-class fixes (Phase 3+). Default: true'
    required: false
    default: 'true'
  enable-wait-fixes:
    description: 'Enable wait/timing-class fixes (Phase 3+). Default: true'
    required: false
    default: 'true'
  enable-assertion-fixes:
    description: 'Enable assertion-class fixes (Phase 4+). Default: true (toggle-only in Phase 3)'
    required: false
    default: 'true'
  enable-slow-fixes:
    description: 'Enable slow-test-class fixes (Phase 4+). Default: true (toggle-only in Phase 3)'
    required: false
    default: 'true'
  startup-timeout-seconds:
    description: 'Max seconds to wait for start-command app to become ready (heal mode). Default: 120'
    required: false
    default: '120'

runs:
  using: composite
  steps:
    - name: Install action dependencies
      shell: bash
      working-directory: ${{ github.action_path }}
      run: npm ci --production

    - name: Set up Node
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0 — re-verified at execution per D-20
      with:
        node-version: '24'

    - name: Run playwright-healer
      shell: bash
      working-directory: ${{ github.action_path }}
      env:
        INPUT_MODE: ${{ inputs.mode }}
        INPUT_API-KEY: ${{ inputs.api-key }}
        INPUT_HEALER-TOKEN: ${{ inputs.healer-token }}
        INPUT_GITHUB-TOKEN: ${{ inputs.github-token }}
        INPUT_SETUP-COMMAND: ${{ inputs.setup-command }}
        INPUT_START-COMMAND: ${{ inputs.start-command }}
        INPUT_TEST-COMMAND: ${{ inputs.test-command }}
        INPUT_BASE-URL: ${{ inputs.base-url }}
        INPUT_PROVIDER: ${{ inputs.provider }}
        INPUT_MODEL: ${{ inputs.model }}
        INPUT_API-ENDPOINT: ${{ inputs.api-endpoint }}
        INPUT_REPORT-PATH: ${{ inputs.report-path }}
        INPUT_FLAKE-RATE-THRESHOLD: ${{ inputs.flake-rate-threshold }}
        INPUT_FLAKE-WINDOW-DAYS: ${{ inputs.flake-window-days }}
        INPUT_SLOW-REGRESSION-PCT: ${{ inputs.slow-regression-pct }}
        INPUT_RERUN-COUNT: ${{ inputs.rerun-count }}
        INPUT_RERUN-PASS-RATE: ${{ inputs.rerun-pass-rate }}
        INPUT_MAX-BUDGET-USD: ${{ inputs.max-budget-usd }}
        INPUT_MAX-TURNS: ${{ inputs.max-turns }}
        INPUT_RETENTION-DAYS: ${{ inputs.retention-days }}
        INPUT_MAX-HEALS-PER-TEST-PER-WEEK: ${{ inputs.max-heals-per-test-per-week }}
        INPUT_ENABLE-SELECTOR-FIXES: ${{ inputs.enable-selector-fixes }}
        INPUT_ENABLE-WAIT-FIXES: ${{ inputs.enable-wait-fixes }}
        INPUT_ENABLE-ASSERTION-FIXES: ${{ inputs.enable-assertion-fixes }}
        INPUT_ENABLE-SLOW-FIXES: ${{ inputs.enable-slow-fixes }}
        INPUT_STARTUP-TIMEOUT-SECONDS: ${{ inputs.startup-timeout-seconds }}
      run: npx tsx src/index.ts
