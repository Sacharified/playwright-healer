name: Self-Test (E2E heal on in-repo fixture)

# SEC-05: Actor guard uses 'playwright-healer-bot' (not 'github-actions[bot]').
# Healer PRs are opened using HEALER_PAT, which carries the PAT owner's identity.
# github-actions[bot] is the built-in token identity — not used by this action.
# BOT_NAME in src/shared/loop-guard.ts is the canonical source for this value.

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'action.yml'
      - '.github/workflows/self-test.yml'
      - 'tests/fixture-app/**'
  pull_request:
    paths:
      - 'src/**'
      - 'action.yml'
      - '.github/workflows/self-test.yml'
      - 'tests/fixture-app/**'
  workflow_dispatch:
    inputs:
      # Existing (Phase 03 era) — defaults retained for maintainer dispatch convenience
      testFile:
        description: 'Test file path (relative to repo root)'
        required: false
        default: 'tests/fixture-app/tests/broken-selector.spec.ts'
      testTitle:
        description: 'Test title (matches a Playwright test() name)'
        required: false
        default: 'clicks submit button and sees confirmation'
      fixClassHint:
        description: 'Fix class hint: selectors | waits | assertions | slow'
        required: false
        default: 'selectors'
      commitSha:
        description: 'Commit SHA to heal against (blank → HEAD of main)'
        required: false
        default: ''
      # NEW Phase 04 — flat run-stats (optional; ingest auto-dispatch always populates)
      flakeRate:
        description: 'Recent flake rate (0.0–1.0). Optional for manual dispatch.'
        required: false
        default: ''
      windowDays:
        description: 'Rolling window in days. Optional for manual dispatch.'
        required: false
        default: ''
      runCount:
        description: 'Recent run count. Optional for manual dispatch.'
        required: false
        default: ''
      # NEW Phase 04 — DET-07 concurrency key (REQUIRED from now on; manual maintainer
      # dispatch must compute it via slug(testFile)+slug(testTitle)+sha1(testFile::testTitle).
      # Default value here is a sentinel so a maintainer can hand-dispatch the broken-selector
      # fixture without computing the hash; ingest's auto-dispatch always passes the real value.
      concurrencyKey:
        description: 'Slug+SHA1 concurrency key per (testFile, testTitle). Compute via src/ingest/dispatch.ts buildConcurrencyKey for ingest-fired dispatches.'
        required: true
        default: 'manual-broken-selector-default'

permissions:
  contents: read

concurrency:
  # workflow-level concurrency must use github.event.inputs.* — the bare `inputs`
  # context here is only populated for `workflow_call`, not `workflow_dispatch`.
  group: playwright-healer-${{ github.repository }}-${{ github.event.inputs.concurrencyKey }}
  cancel-in-progress: false

jobs:
  # ── Job 1: Red guard — the fixture test MUST fail without intervention ──
  assert-test-broken:
    name: Assert fixture test is broken
    runs-on: ubuntu-latest
    if: >-
      !contains(github.event.head_commit.message, '[skip-healer]') &&
      github.actor != 'playwright-healer-bot'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: '24'
          # Cache npm downloads keyed on the fixture's lockfile. Cuts ~10–20s on
          # cache hit. assert-test-broken has its own lockfile distinct from the
          # action root (different deps tree).
          cache: 'npm'
          cache-dependency-path: tests/fixture-app/package-lock.json

      - name: Cache Playwright browsers
        id: pw-browsers
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: ~/.cache/ms-playwright
          # Hash the fixture lockfile — the chromium version Playwright resolves
          # is locked by @playwright/test's pinned version, which lockfile
          # changes track. ~150–300 MB browser download is the longest install
          # step (~5 min on cache miss); cache hit drops it to seconds.
          key: pw-browsers-${{ runner.os }}-${{ hashFiles('tests/fixture-app/package-lock.json') }}

      - name: Install fixture deps
        working-directory: tests/fixture-app
        run: npm ci

      - name: Install Playwright browsers (full — cache miss)
        if: steps.pw-browsers.outputs.cache-hit != 'true'
        working-directory: tests/fixture-app
        run: npx playwright install chromium --with-deps

      - name: Install Playwright OS deps only (cache hit)
        # Cached browser binaries are still good across runs, but the runner's
        # apt-installed system libraries (libnss, libasound, etc.) are not part
        # of the Playwright cache and have to be re-applied on every run on
        # a fresh ubuntu runner. install-deps is fast (~10s) — full install
        # would re-download the browser unnecessarily on cache hit.
        if: steps.pw-browsers.outputs.cache-hit == 'true'
        working-directory: tests/fixture-app
        run: npx playwright install-deps chromium

      - name: Start fixture server
        working-directory: tests/fixture-app
        run: |
          npm run start &
          echo $! > /tmp/fixture-pid
          # naive readiness wait — http-server binds in well under a second
          for i in 1 2 3 4 5; do
            if curl -fsS http://localhost:8080/ > /dev/null; then
              echo "fixture server up"
              break
            fi
            sleep 1
          done

      - name: Run broken test (must FAIL)
        working-directory: tests/fixture-app
        env:
          BASE_URL: http://localhost:8080
        run: |
          set +e
          npx playwright test --reporter=list
          EXIT=$?
          set -e
          if [ "$EXIT" -eq 0 ]; then
            echo "::error::Fixture test passed unexpectedly. Either the test is no longer broken (a heal PR was merged?) or the fixture is misconfigured. Revert tests/fixture-app/tests/broken-selector.spec.ts to its broken form."
            exit 1
          fi
          echo "Test failed as expected (exit $EXIT) — broken state confirmed."

      - name: Stop fixture server
        if: always()
        run: |
          kill "$(cat /tmp/fixture-pid)" 2>/dev/null || true

  # ── Job 2: Heal — invoke the action against the broken test ──
  # Gated to workflow_dispatch only: the heal step requires populated dispatch
  # inputs (commitSha, testFile, testTitle, fixClassHint, concurrencyKey) which
  # are only available on workflow_dispatch events. On push/PR, github.event.inputs
  # is empty and the Zod-validated dispatch payload at the action boundary (D-18)
  # rejects undefined values. Push/PR events run only the dry-run/security
  # scenarios (job 1 above + scenarios 3-N below) which don't require LLM API
  # spend; live heal stays a manual maintainer trigger.
  heal:
    name: Heal broken test
    needs: assert-test-broken
    if: >-
      github.event_name == 'workflow_dispatch' &&
      !contains(github.event.head_commit.message, '[skip-healer]') &&
      github.actor != 'playwright-healer-bot'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false
          # heal mode does its own fetch/checkout from inputs.commit_sha or HEAD

      - name: Resolve dispatch SHA
        id: resolve
        run: |
          INPUT_SHA="${{ inputs.commitSha }}"
          if [ -z "$INPUT_SHA" ]; then
            INPUT_SHA="$(git rev-parse HEAD)"
          fi
          echo "sha=$INPUT_SHA" >> "$GITHUB_OUTPUT"

      # Pre-warm caches BEFORE the action runs so its internal install steps
      # (npm ci --production at action_path; playwright install chromium for
      # the @playwright/mcp browser; user-supplied setup_command's npm install
      # + playwright install for the fixture app) all hit warm caches and
      # become near-no-ops on cache hit.
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: '24'
          cache: 'npm'
          # Hash both lockfiles: the action's root deps (package-lock.json) and
          # the fixture app's deps (tests/fixture-app/package-lock.json). Either
          # changing should bust the cache.
          cache-dependency-path: |
            package-lock.json
            tests/fixture-app/package-lock.json

      - name: Cache Playwright browsers
        id: pw-browsers
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: ~/.cache/ms-playwright
          # ~/.cache/ms-playwright stores chromium-XXXX/ directories, one per
          # Playwright version. The action uses @playwright/mcp@0.0.70 (pinned
          # in package.json) which has its own playwright-core version; the
          # fixture-app uses @playwright/test (its own version). Both versions
          # coexist in the cache directory keyed by build number, so caching
          # the whole ~/.cache/ms-playwright covers both. Cache key hashes
          # both lockfiles so a version bump on either side invalidates.
          key: pw-browsers-${{ runner.os }}-${{ hashFiles('package-lock.json', 'tests/fixture-app/package-lock.json') }}

      # On cache hit, install only the apt-level system libraries the cached
      # chromium binary needs (libnss, libasound, etc.). Browser binaries are
      # pulled from the cache; no download. On cache miss, this step is a
      # no-op — the action's Step 3.1 (and the user's setup_command) will run
      # the full `playwright install chromium --with-deps` which downloads
      # the browser AND installs the OS deps.
      - name: Install Playwright OS deps (cache hit only)
        if: steps.pw-browsers.outputs.cache-hit == 'true'
        working-directory: tests/fixture-app
        run: npx playwright install-deps chromium

      # action.yml reads dispatch payload via github.context.payload.inputs.
      # workflow_dispatch already populates that — no extra plumbing needed.
      - name: Run playwright-healer (heal mode, self-consumed)
        uses: ./
        with:
          mode: heal
          # Phase 01.4 — switched from GitHub Models to OpenRouter (the new
          # recommended provider after the four-provider → three-provider
          # consolidation). OpenRouter routes to anthropic/claude-sonnet-4.6
          # (the new default model). api_key is the OPENROUTER_API_KEY repo
          # secret; healer_token is still HEALER_PAT (PR creation, issue
          # creation, workflow_dispatch — fine-grained PAT with repo /
          # contents:write + pull-requests:write + issues:write scopes).
          provider: openrouter
          model: anthropic/claude-sonnet-4.6
          api_key: ${{ secrets.OPENROUTER_API_KEY }}
          healer_token: ${{ secrets.HEALER_PAT }}
          commit_sha: ${{ steps.resolve.outputs.sha }}
          base_url: http://localhost:8080
          setup_command: 'cd tests/fixture-app && npm install && npx playwright install chromium'
          start_command: 'cd tests/fixture-app && npm run start'
          test_command: 'cd tests/fixture-app && npx playwright test'
          max_budget_usd: '1.00'
          max_turns: '10'
          # Demo-mode flags inherited from Phase 03.1 — UPDATED Phase 04:
          # post-fix validation re-engaged (RESEARCH §"Diff-Lint Compatibility
          # Verification" empirically confirms the existing selector heal still
          # passes the validator). Deterministic check stays skipped because the
          # broken-fixture is deterministic by design (the bug is intentional).
          skip_deterministic_check: 'true'
          # skip_post_fix_validation: 'true'   # REMOVED Phase 04 — validation re-engaged
          # Keep diff-lint ENABLED — it scopes the agent's diff to test files
          # only, preventing accidental modifications to action source.
          skip_diff_lint: 'false'

  # ── Job 3: Verify the heal job produced an artifact (PR OR issue) ──
  # Per D-09 routing tree: a successful heal lands a PR; a heal where post-fix
  # validation or diff-lint blocks routes to an issue. Both are valid outcomes
  # of an end-to-end heal — what we're verifying is "an artifact was created
  # for this run", not "a PR specifically was created".
  assert-artifact-opened:
    name: Assert healer artifact (PR or issue) exists
    needs: heal
    runs-on: ubuntu-latest
    if: >-
      !contains(github.event.head_commit.message, '[skip-healer]') &&
      github.actor != 'playwright-healer-bot'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false

      - name: Wait briefly for PR/issue creation propagation
        run: sleep 5

      - name: Verify a healer artifact was opened
        env:
          GH_TOKEN: ${{ secrets.HEALER_PAT }}
        run: |
          PR_JSON=$(gh pr list \
            -R ${{ github.repository }} \
            --search "[playwright-healer] Fix flaky in:title" \
            --state open \
            --json number,title,url \
            --limit 5)
          PR_COUNT=$(echo "$PR_JSON" | jq 'length')
          ISSUE_JSON=$(gh issue list \
            -R ${{ github.repository }} \
            --search "[playwright-healer] in:title" \
            --state open \
            --json number,title,url \
            --limit 5)
          ISSUE_COUNT=$(echo "$ISSUE_JSON" | jq 'length')
          if [ "$PR_COUNT" -eq 0 ] && [ "$ISSUE_COUNT" -eq 0 ]; then
            echo "::error::No healer PR or issue was opened. Heal job appeared to succeed but no artifact exists."
            exit 1
          fi
          if [ "$PR_COUNT" -gt 0 ]; then
            echo "Found $PR_COUNT healer PR(s):"
            echo "$PR_JSON" | jq -r '.[] | "  #\(.number): \(.title)\n  \(.url)"'
            echo
            echo "::notice::E2E self-heal verified — landed a PR (post-fix validation passed)."
          fi
          if [ "$ISSUE_COUNT" -gt 0 ]; then
            echo "Found $ISSUE_COUNT healer issue(s):"
            echo "$ISSUE_JSON" | jq -r '.[] | "  #\(.number): \(.title)\n  \(.url)"'
            echo
            echo "::notice::E2E self-heal verified — landed an issue (D-09 routed to issue path because post-fix validation/diff-lint blocked the fix). This is a valid Phase 4 outcome."
          fi
