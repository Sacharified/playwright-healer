name: Phase 1 Self-Test

on:
  push:
  pull_request:

permissions:
  contents: read
  actions: read          # required by Job B to call gh api on Job A's log

jobs:

  # ──────────────────────────────────────────────────────────────────
  # SCENARIO 1 (SEC-06 / ROADMAP SC#3 / T-1-06) — Canary-mask TWO-JOB pattern.
  #   Job A invokes the action with the inline canary API key.
  #   Job B (needs: A, if: always()) fetches Job A's finalized log via gh api
  #   and asserts the raw canary string does NOT appear.
  # Per PATTERNS Pattern 13, a single-job post-step would race the log API.
  # ──────────────────────────────────────────────────────────────────

  self-test-masking:
    name: 'Self-test — mask canary secret'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2 — re-verified at execution
        with:
          persist-credentials: false

      # ──────────────────────────────────────────────────────────────────
      # Phase 01.3 SC#2 (option a): pre-register the canary with the runner
      # masker BEFORE `uses: ./` so the masker is engaged when the runner
      # emits the action's step header (which contains `with: api-key:
      # <canary>` AND `INPUT_API-KEY: <canary>`). Masking is non-retroactive
      # (RESEARCH §Pattern 4 / Pitfall 4) — registration MUST precede the
      # log line that would otherwise emit the secret.
      #
      # What this verifies: the runner masker correctly redacts the canary
      # in the step header AND in any log lines emitted by the action body.
      #
      # What this does NOT directly verify: that src/index.ts calls
      # core.setSecret() correctly. That contract is verified by Scenario 4,
      # which greps the dispatcher-emitted dry-run-summary output for canary
      # absence (the markdown table redacts api-key independently of any
      # upstream masking).
      # ──────────────────────────────────────────────────────────────────
      - name: Pre-register canary with runner masker
        shell: bash
        run: echo "::add-mask::test-canary-DO-NOT-USE-REAL-KEY"

      - name: Invoke action with dry-run and inline canary API key
        uses: ./
        with:
          mode: dry-run
          provider: anthropic
          api-key: 'test-canary-DO-NOT-USE-REAL-KEY'
          healer-token: 'test-canary-healer-token'
          github-token: ${{ github.token }}

  verify-log-mask:
    name: 'Verify canary was masked in previous job log'
    runs-on: ubuntu-latest
    needs: self-test-masking
    if: always()
    steps:
      - name: Fetch Job A log and assert canary is absent
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          # Locate Job A by its literal job name — MUST match the `name:` on self-test-masking above.
          JOB_ID=$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs" \
            --jq '.jobs[] | select(.name=="Self-test — mask canary secret") | .id')
          if [ -z "$JOB_ID" ]; then
            echo "::error::Could not find job id for self-test-masking"
            echo "--- Available jobs in this run: ---"
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs" --jq '.jobs[] | .name'
            exit 1
          fi
          echo "Job A id: $JOB_ID"
          gh api "repos/${GITHUB_REPOSITORY}/actions/jobs/${JOB_ID}/logs" > job-a.log
          # Phase 01.3 plan-correction: the runner echoes every `run:` block's
          # command text in the step header (the `[36;1m...[0m` ANSI display)
          # BEFORE the shell executes the command and BEFORE stdout-emitted
          # ::add-mask:: registrations take effect. The "Pre-register canary
          # with runner masker" step's own command (echo "::add-mask::LITERAL")
          # therefore necessarily contains the literal in its log line — that
          # is the registration mechanism, not a leak.
          #
          # Filter `::add-mask::` lines from the haystack before grepping for
          # the canary. By construction those lines contain the literal. Any
          # OTHER leak (from the `with:` step header on `uses: ./`, from an
          # INPUT_API-KEY env-block dump, from the action body output) still
          # contains the canary on a non-`::add-mask::` line and trips the gate.
          grep -v '::add-mask::' job-a.log > job-a-filtered.log
          if grep -q 'test-canary-DO-NOT-USE-REAL-KEY' job-a-filtered.log; then
            echo "::error::Canary appeared in the log — masking FAILED"
            echo "--- Offending lines (after filtering ::add-mask:: registration lines): ---"
            grep -n 'test-canary-DO-NOT-USE-REAL-KEY' job-a-filtered.log | head -20
            exit 1
          fi
          echo "OK: canary was masked (raw value not found in Job A log outside ::add-mask:: registration lines)"

  # ──────────────────────────────────────────────────────────────────
  # SCENARIO 2 (CFG-05 / ROADMAP SC#4 / D-06) — Invalid mode fails with Zod error.
  # ──────────────────────────────────────────────────────────────────

  self-test-invalid-mode:
    name: 'Self-test — invalid mode fails fast'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false

      - name: Invoke with mode=banana (expected to fail)
        id: run
        continue-on-error: true
        uses: ./
        with:
          mode: banana
          provider: anthropic
          api-key: 'test-canary-DO-NOT-USE-REAL-KEY'
          healer-token: 'test-canary-healer-token'
          github-token: ${{ github.token }}

      - name: Assert the invocation failed (exit code 1)
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ steps.run.outcome }}" != "failure" ]; then
            echo "::error::Expected failure for mode=banana, got outcome=${{ steps.run.outcome }}"
            exit 1
          fi
          echo "OK: invalid mode produced failure outcome"

  # ──────────────────────────────────────────────────────────────────
  # SCENARIO 3 (CFG-02 / SC#4) — Missing/empty api-key fails cleanly when
  # provider is anthropic (Zod superRefine). This is the anthropic side of
  # the per-provider api-key enforcement pair with Scenario 5.
  # ──────────────────────────────────────────────────────────────────

  self-test-missing-api-key:
    name: 'Self-test — missing api key fails cleanly (anthropic)'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false

      - name: Invoke with empty api-key + provider=anthropic (expected to fail)
        id: run
        continue-on-error: true
        uses: ./
        with:
          mode: dry-run
          provider: anthropic
          api-key: ''
          healer-token: 'test-canary-healer-token'
          github-token: ${{ github.token }}

      - name: Assert failure
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ steps.run.outcome }}" != "failure" ]; then
            echo "::error::Expected failure for empty api-key with provider=anthropic, got outcome=${{ steps.run.outcome }}"
            exit 1
          fi
          echo "OK: empty api-key + provider=anthropic produced failure outcome"

  # ──────────────────────────────────────────────────────────────────
  # SCENARIO 4 (CFG-05 happy path / TEST-01) — dry-run exits 0 and the
  # composite-action output `dry-run-summary` carries a redacted markdown
  # table with no canary leak. Reads from steps.run.outputs.dry-run-summary
  # rather than $GITHUB_STEP_SUMMARY (which is per-step — Phase 01.3 SC#1).
  # Defense-in-depth on top of Scenario 1's log grep: this scenario verifies
  # the dispatcher's setSecret-driven redaction in the markdown table; that
  # is the contract Scenario 1 option (a) does NOT directly verify.
  # ──────────────────────────────────────────────────────────────────

  self-test-dry-run:
    name: 'Self-test — dry-run succeeds and redacts secrets in summary'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false

      - name: Invoke with mode=dry-run and canary api key
        id: run
        uses: ./
        with:
          mode: dry-run
          provider: anthropic
          model: ''
          api-endpoint: ''
          api-key: 'test-canary-DO-NOT-USE-REAL-KEY'
          healer-token: 'test-canary-healer-token'
          github-token: ${{ github.token }}

      - name: Assert success and dry-run-summary output redacts canary
        shell: bash
        env:
          SUMMARY: ${{ steps.run.outputs.dry-run-summary }}
        run: |
          set -euo pipefail
          if [ "${{ steps.run.outcome }}" != "success" ]; then
            echo "::error::Expected success for dry-run, got outcome=${{ steps.run.outcome }}"
            exit 1
          fi
          if [ -z "$SUMMARY" ]; then
            echo "::error::dry-run-summary output was empty — runDryRun helper regression OR composite-action output mapping broken (check action.yml outputs.dry-run-summary.value AND id: run-playwright-healer on Step 6)"
            exit 1
          fi
          if echo "$SUMMARY" | grep -q 'test-canary-DO-NOT-USE-REAL-KEY'; then
            echo "::error::Canary appeared in dry-run-summary output — redaction FAILED"
            exit 1
          fi
          if ! echo "$SUMMARY" | grep -q 'dry-run summary'; then
            echo "::error::Expected 'dry-run summary' marker in output — dispatcher did not write the redacted output"
            exit 1
          fi
          if ! echo "$SUMMARY" | grep -q '| `provider` | anthropic |'; then
            echo "::error::Expected 'provider | anthropic' row — new 01.1 provider input not reaching dry-run output"
            exit 1
          fi
          echo "OK: dry-run success + summary redaction verified via composite-action output"

  # ──────────────────────────────────────────────────────────────────
  # SCENARIO 5 (01.1 — Ollama empty-key dry-run path / TEST-01) — load-
  # bearing test for the `required: true` removal on api-key. With
  # provider=ollama, empty api-key MUST NOT trigger the Zod superRefine
  # issue, and the dispatcher MUST exit 0. Also proves the new provider/
  # api-endpoint inputs reach the dry-run summary output. Reads from
  # steps.run.outputs.dry-run-summary rather than $GITHUB_STEP_SUMMARY
  # (per Phase 01.3 SC#1 fix).
  # ──────────────────────────────────────────────────────────────────

  self-test-ollama-empty-key:
    name: 'Self-test — ollama empty api key succeeds (dry-run)'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false

      - name: Invoke with provider=ollama, empty api-key, localhost endpoint
        id: run
        uses: ./
        with:
          mode: dry-run
          provider: ollama
          api-key: ''
          api-endpoint: 'http://localhost:11434'
          healer-token: 'test-canary-healer-token'
          github-token: ${{ github.token }}

      - name: Assert success + dry-run-summary output reflects ollama provider + endpoint
        shell: bash
        env:
          SUMMARY: ${{ steps.run.outputs.dry-run-summary }}
        run: |
          set -euo pipefail
          if [ "${{ steps.run.outcome }}" != "success" ]; then
            echo "::error::Expected success for provider=ollama + empty api-key, got outcome=${{ steps.run.outcome }}"
            exit 1
          fi
          if [ -z "$SUMMARY" ]; then
            echo "::error::dry-run-summary output was empty"
            exit 1
          fi
          if ! echo "$SUMMARY" | grep -q '| `provider` | ollama |'; then
            echo "::error::Expected 'provider | ollama' row in output"
            exit 1
          fi
          if ! echo "$SUMMARY" | grep -q '| `api-endpoint` | http://localhost:11434 |'; then
            echo "::error::Expected api-endpoint row with localhost:11434 in output"
            exit 1
          fi
          if ! echo "$SUMMARY" | grep -q '(empty — allowed for ollama)'; then
            echo "::error::Expected 'empty — allowed for ollama' api-key cell — dispatcher did not detect the ollama-exception path"
            exit 1
          fi
          echo "OK: ollama empty-key dry-run path verified via composite-action output"

  # ──────────────────────────────────────────────────────────────────
  # SCENARIO 6 (Phase 01.2 — npx-tsx env-var stripping regression test).
  # Asserts the action's chosen spawn shape (./node_modules/.bin/tsx) preserves
  # a hyphenated INPUT_* env var. Pre-existing bug: `npx tsx` strips env vars
  # whose names contain hyphens, so every kebab-cased input arrived as empty
  # at the spawned Node process. See 03-HUMAN-UAT.md G-01 + 01.2-CONTEXT.md.
  #
  # This job is intentionally minimal — it does NOT invoke `uses: ./` (which
  # would trigger real-mode validation noise). It runs `npm ci --production`
  # in the action dir and then exercises the spawn one-liner with a hyphenated
  # env var, asserting the var arrives at the Node process intact.
  # ──────────────────────────────────────────────────────────────────

  self-test-hyphenated-input-env:
    name: 'Self-test — hyphenated INPUT_* env var survives action spawn shape'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: '24'

      - name: Install action runtime deps (matches action.yml Step 2)
        shell: bash
        run: npm ci --production

      - name: Assert hyphenated INPUT_* survives ./node_modules/.bin/tsx spawn
        shell: bash
        env:
          INPUT_FOO-BAR: hello
        run: |
          set -euo pipefail
          # Use the same spawn shape that action.yml Step 6 now uses.
          # If this fails, the npx-tsx fix has regressed.
          ./node_modules/.bin/tsx -e "if (process.env['INPUT_FOO-BAR'] !== 'hello') { console.error('::error::INPUT_FOO-BAR was stripped or mutated. Got:', JSON.stringify(process.env['INPUT_FOO-BAR'])); process.exit(1); } console.log('OK: INPUT_FOO-BAR survived spawn (length=' + process.env['INPUT_FOO-BAR'].length + ')');"

  # ──────────────────────────────────────────────────────────────────
  # SCENARIO 7 (Phase 03 UAT Test 2 / IN-01 startup-timeout cleanup) —
  # heal-mode start-command intentionally never opens base-url; verify
  # Step 5 (wait-for-ready.ts) times out at 10s, Step 7 (if: always())
  # cleanup kills both the captured wrapper PID and its child node PID.
  #
  # Mirrors the npm-run-dev signal-propagation contract: a parent shell
  # wrapper + a child node process. SIGTERM to the wrapper must reach
  # the child via the wrapper's trap (npm@10+ does this correctly via
  # run-script's signal forwarding). If the child survives, IN-01 is
  # violated and zombie chromium/playwright-mcp processes will leak in
  # production heal runs.
  #
  # No real PAT or LLM call is exercised — provider=ollama with empty
  # api-key passes Zod superRefine; Step 6 never runs because Step 5
  # fails; Step 7 (if: always()) does run and is the unit under test.
  # ──────────────────────────────────────────────────────────────────
  self-test-startup-timeout-cleanup:
    name: 'Self-test — heal mode startup-timeout triggers clean process teardown'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false

      - name: Create never-ready wrapper fixture (mimics npm-run-dev shape)
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/never-ready.sh <<'WRAPPER'
          #!/bin/bash
          # IN-01 fixture: parent shell wrapper + child node process.
          # SIGTERM to the wrapper must propagate to the child via trap.
          node -e 'process.title = "never-ready-marker"; setInterval(() => {}, 1000)' &
          NODE_PID=$!
          echo "wrapper-pid=$$ child-node-pid=$NODE_PID" > /tmp/never-ready-pids.txt
          trap "kill -TERM $NODE_PID 2>/dev/null; wait $NODE_PID 2>/dev/null; exit 0" TERM INT
          wait $NODE_PID
          WRAPPER
          chmod +x /tmp/never-ready.sh

      - name: Invoke action with never-ready start-command (heal mode, 10s timeout)
        id: run
        continue-on-error: true
        uses: ./
        with:
          mode: heal
          provider: ollama
          api-key: ''
          api-endpoint: http://localhost:11434
          healer-token: 'test-canary-pat-DO-NOT-USE'
          github-token: ${{ github.token }}
          setup-command: 'echo "no setup needed"'
          start-command: '/tmp/never-ready.sh'
          test-command: 'echo "no test needed"'
          base-url: 'http://localhost:3000'
          startup-timeout-seconds: '10'

      - name: Assert action failed at Step 5 (startup-timeout reached)
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ steps.run.outcome }}" != "failure" ]; then
            echo "::error::Expected outcome=failure (startup-timeout) but got outcome=${{ steps.run.outcome }}"
            exit 1
          fi
          echo "OK: action failed as expected (Step 5 wait-for-ready hit 10s timeout)"

      - name: Assert no zombie processes remain (Step 7 cleanup + IN-01 propagation)
        shell: bash
        run: |
          set -euo pipefail

          # Diagnostic: surface the PIDs the wrapper recorded so failure logs are decodable.
          if [ -f /tmp/never-ready-pids.txt ]; then
            echo "Wrapper recorded: $(cat /tmp/never-ready-pids.txt)"
          else
            echo "::warning::/tmp/never-ready-pids.txt missing — wrapper may not have started before timeout"
          fi

          # 1. The captured app PID (Step 5 stored it via echo $! > /tmp/playwright-healer-app-pid).
          #    Step 7 ran `kill "$(cat /tmp/playwright-healer-app-pid)"` — it should be dead now.
          if [ -f /tmp/playwright-healer-app-pid ]; then
            APP_PID=$(cat /tmp/playwright-healer-app-pid)
            echo "Action captured app PID: $APP_PID"
            if kill -0 "$APP_PID" 2>/dev/null; then
              echo "::error::Captured app PID $APP_PID is STILL ALIVE after Step 7 cleanup"
              ps -ef | head -50
              exit 1
            fi
            echo "OK: captured app PID $APP_PID is dead"
          else
            echo "::warning::/tmp/playwright-healer-app-pid missing — Step 5 may have failed before the spawn line"
          fi

          # 2. The child node process (the actual workload spawned by the wrapper).
          #    If pgrep finds the marker, the wrapper's trap did NOT forward SIGTERM
          #    to the child — IN-01 contract is broken and production heal runs
          #    would leak the user's app process.
          if pgrep -f never-ready-marker >/dev/null 2>&1; then
            echo "::error::never-ready-marker child node STILL ALIVE — wrapper SIGTERM did NOT propagate (IN-01 violation)"
            pgrep -af never-ready-marker
            exit 1
          fi
          echo "OK: never-ready-marker child node is dead — wrapper-to-child SIGTERM propagation verified (IN-01)"

          # 3. Defense-in-depth: no playwright-mcp / chromium leaked. Step 6 didn't run
          #    in this scenario — it would have if Step 5 succeeded — but if a future
          #    Phase 03 plan wires MCP earlier, this catches it.
          if pgrep -f playwright-mcp >/dev/null 2>&1; then
            echo "::error::playwright-mcp process leaked after cleanup"
            pgrep -af playwright-mcp
            exit 1
          fi
          echo "OK: no playwright-mcp processes"

          if pgrep -x chromium >/dev/null 2>&1 || pgrep -x chrome >/dev/null 2>&1; then
            echo "::error::chromium/chrome process leaked after cleanup"
            pgrep -af 'chromium|chrome' || true
            exit 1
          fi
          echo "OK: no chromium processes"

          echo "OK: zombie-process check passed — Step 7 cleanup + IN-01 wrapper-to-child SIGTERM both functional"
