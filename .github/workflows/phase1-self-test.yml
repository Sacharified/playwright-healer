name: Phase 1 Self-Test

on:
  push:
  pull_request:

permissions:
  contents: read
  actions: read          # required by Job B to call gh api on Job A's log

jobs:

  # ──────────────────────────────────────────────────────────────────
  # SCENARIO 1 (SEC-06 / ROADMAP SC#3 / T-1-06) — Canary-mask TWO-JOB pattern.
  #   Job A invokes the action with the inline canary API key.
  #   Job B (needs: A, if: always()) fetches Job A's finalized log via gh api
  #   and asserts the raw canary string does NOT appear.
  # Per PATTERNS Pattern 13, a single-job post-step would race the log API.
  # ──────────────────────────────────────────────────────────────────

  self-test-masking:
    name: 'Self-test — mask canary secret'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2 — re-verified at execution
        with:
          persist-credentials: false

      - name: Invoke action with dry-run and inline canary API key
        uses: ./
        with:
          mode: dry-run
          provider: anthropic
          api-key: 'test-canary-DO-NOT-USE-REAL-KEY'
          healer-token: 'test-canary-healer-token'
          github-token: ${{ github.token }}

  verify-log-mask:
    name: 'Verify canary was masked in previous job log'
    runs-on: ubuntu-latest
    needs: self-test-masking
    if: always()
    steps:
      - name: Fetch Job A log and assert canary is absent
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          # Locate Job A by its literal job name — MUST match the `name:` on self-test-masking above.
          JOB_ID=$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs" \
            --jq '.jobs[] | select(.name=="Self-test — mask canary secret") | .id')
          if [ -z "$JOB_ID" ]; then
            echo "::error::Could not find job id for self-test-masking"
            echo "--- Available jobs in this run: ---"
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs" --jq '.jobs[] | .name'
            exit 1
          fi
          echo "Job A id: $JOB_ID"
          gh api "repos/${GITHUB_REPOSITORY}/actions/jobs/${JOB_ID}/logs" > job-a.log
          if grep -q 'test-canary-DO-NOT-USE-REAL-KEY' job-a.log; then
            echo "::error::Canary appeared in the log — masking FAILED"
            echo "--- Offending lines: ---"
            grep -n 'test-canary-DO-NOT-USE-REAL-KEY' job-a.log | head -20
            exit 1
          fi
          echo "OK: canary was masked (raw value not found in Job A log)"

  # ──────────────────────────────────────────────────────────────────
  # SCENARIO 2 (CFG-05 / ROADMAP SC#4 / D-06) — Invalid mode fails with Zod error.
  # ──────────────────────────────────────────────────────────────────

  self-test-invalid-mode:
    name: 'Self-test — invalid mode fails fast'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false

      - name: Invoke with mode=banana (expected to fail)
        id: run
        continue-on-error: true
        uses: ./
        with:
          mode: banana
          provider: anthropic
          api-key: 'test-canary-DO-NOT-USE-REAL-KEY'
          healer-token: 'test-canary-healer-token'
          github-token: ${{ github.token }}

      - name: Assert the invocation failed (exit code 1)
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ steps.run.outcome }}" != "failure" ]; then
            echo "::error::Expected failure for mode=banana, got outcome=${{ steps.run.outcome }}"
            exit 1
          fi
          echo "OK: invalid mode produced failure outcome"

  # ──────────────────────────────────────────────────────────────────
  # SCENARIO 3 (CFG-02 / SC#4) — Missing/empty api-key fails cleanly when
  # provider is anthropic (Zod superRefine). This is the anthropic side of
  # the per-provider api-key enforcement pair with Scenario 5.
  # ──────────────────────────────────────────────────────────────────

  self-test-missing-api-key:
    name: 'Self-test — missing api key fails cleanly (anthropic)'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false

      - name: Invoke with empty api-key + provider=anthropic (expected to fail)
        id: run
        continue-on-error: true
        uses: ./
        with:
          mode: dry-run
          provider: anthropic
          api-key: ''
          healer-token: 'test-canary-healer-token'
          github-token: ${{ github.token }}

      - name: Assert failure
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ steps.run.outcome }}" != "failure" ]; then
            echo "::error::Expected failure for empty api-key with provider=anthropic, got outcome=${{ steps.run.outcome }}"
            exit 1
          fi
          echo "OK: empty api-key + provider=anthropic produced failure outcome"

  # ──────────────────────────────────────────────────────────────────
  # SCENARIO 4 (CFG-05 happy path) — dry-run exits 0 and writes redacted summary.
  # Artifact step also cross-checks the summary file has no canary leak
  # (defense-in-depth on top of Scenario 1's log grep).
  # ──────────────────────────────────────────────────────────────────

  self-test-dry-run:
    name: 'Self-test — dry-run succeeds and redacts secrets in summary'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false

      - name: Invoke with mode=dry-run and canary api key
        id: run
        uses: ./
        with:
          mode: dry-run
          provider: anthropic
          model: ''
          api-endpoint: ''
          api-key: 'test-canary-DO-NOT-USE-REAL-KEY'
          healer-token: 'test-canary-healer-token'
          github-token: ${{ github.token }}

      - name: Assert success and summary file present without canary leak
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ steps.run.outcome }}" != "success" ]; then
            echo "::error::Expected success for dry-run, got outcome=${{ steps.run.outcome }}"
            exit 1
          fi
          # $GITHUB_STEP_SUMMARY accumulates across steps in the same job.
          # At this point the previous step populated it.
          if [ -s "$GITHUB_STEP_SUMMARY" ]; then
            if grep -q 'test-canary-DO-NOT-USE-REAL-KEY' "$GITHUB_STEP_SUMMARY"; then
              echo "::error::Canary appeared in \$GITHUB_STEP_SUMMARY — dry-run redaction FAILED"
              exit 1
            fi
            if ! grep -q 'dry-run summary' "$GITHUB_STEP_SUMMARY"; then
              echo "::error::Expected 'dry-run summary' marker in \$GITHUB_STEP_SUMMARY — dispatcher did not write the redacted output"
              exit 1
            fi
            if ! grep -q '| `provider` | anthropic |' "$GITHUB_STEP_SUMMARY"; then
              echo "::error::Expected 'provider | anthropic' row in \$GITHUB_STEP_SUMMARY — new 01.1 provider input not reaching dry-run output"
              exit 1
            fi
          else
            echo "::error::\$GITHUB_STEP_SUMMARY was empty — runDryRun helper regression; Scenario 4 expects a redacted summary dump"
            exit 1
          fi
          echo "OK: dry-run success + summary redaction verified"

  # ──────────────────────────────────────────────────────────────────
  # SCENARIO 5 (01.1 — Ollama empty-key dry-run path) — load-bearing test
  # for the `required: true` removal on api-key. With provider=ollama,
  # empty api-key MUST NOT trigger the Zod superRefine issue, and the
  # dispatcher MUST exit 0. Also proves the new provider/api-endpoint
  # inputs reach the dry-run summary output.
  # ──────────────────────────────────────────────────────────────────

  self-test-ollama-empty-key:
    name: 'Self-test — ollama empty api key succeeds (dry-run)'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false

      - name: Invoke with provider=ollama, empty api-key, localhost endpoint
        id: run
        uses: ./
        with:
          mode: dry-run
          provider: ollama
          api-key: ''
          api-endpoint: 'http://localhost:11434'
          healer-token: 'test-canary-healer-token'
          github-token: ${{ github.token }}

      - name: Assert success + summary reflects ollama provider + endpoint
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ steps.run.outcome }}" != "success" ]; then
            echo "::error::Expected success for provider=ollama + empty api-key, got outcome=${{ steps.run.outcome }}"
            exit 1
          fi
          if [ ! -s "$GITHUB_STEP_SUMMARY" ]; then
            echo "::error::\$GITHUB_STEP_SUMMARY was empty"
            exit 1
          fi
          if ! grep -q '| `provider` | ollama |' "$GITHUB_STEP_SUMMARY"; then
            echo "::error::Expected 'provider | ollama' row in summary"
            exit 1
          fi
          if ! grep -q '| `api-endpoint` | http://localhost:11434 |' "$GITHUB_STEP_SUMMARY"; then
            echo "::error::Expected api-endpoint row with localhost:11434 in summary"
            exit 1
          fi
          if ! grep -q '(empty — allowed for ollama)' "$GITHUB_STEP_SUMMARY"; then
            echo "::error::Expected 'empty — allowed for ollama' api-key cell — dispatcher did not detect the ollama-exception path"
            exit 1
          fi
          echo "OK: ollama empty-key dry-run path verified"

  # ──────────────────────────────────────────────────────────────────
  # SCENARIO 6 (Phase 01.2 — npx-tsx env-var stripping regression test).
  # Asserts the action's chosen spawn shape (./node_modules/.bin/tsx) preserves
  # a hyphenated INPUT_* env var. Pre-existing bug: `npx tsx` strips env vars
  # whose names contain hyphens, so every kebab-cased input arrived as empty
  # at the spawned Node process. See 03-HUMAN-UAT.md G-01 + 01.2-CONTEXT.md.
  #
  # This job is intentionally minimal — it does NOT invoke `uses: ./` (which
  # would trigger real-mode validation noise). It runs `npm ci --production`
  # in the action dir and then exercises the spawn one-liner with a hyphenated
  # env var, asserting the var arrives at the Node process intact.
  # ──────────────────────────────────────────────────────────────────

  self-test-hyphenated-input-env:
    name: 'Self-test — hyphenated INPUT_* env var survives action spawn shape'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: '24'

      - name: Install action runtime deps (matches action.yml Step 2)
        shell: bash
        run: npm ci --production

      - name: Assert hyphenated INPUT_* survives ./node_modules/.bin/tsx spawn
        shell: bash
        env:
          INPUT_FOO-BAR: hello
        run: |
          set -euo pipefail
          # Use the same spawn shape that action.yml Step 6 now uses.
          # If this fails, the npx-tsx fix has regressed.
          ./node_modules/.bin/tsx -e "if (process.env['INPUT_FOO-BAR'] !== 'hello') { console.error('::error::INPUT_FOO-BAR was stripped or mutated. Got:', JSON.stringify(process.env['INPUT_FOO-BAR'])); process.exit(1); } console.log('OK: INPUT_FOO-BAR survived spawn (length=' + process.env['INPUT_FOO-BAR'].length + ')');"
